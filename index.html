<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon.com. Spend less. Smile more.</title>
    <link rel="icon" href="/Amazon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
<body>

    <!-- Cabezera -->
    <header>
        <div class="logo"> 🛒 Amazon</div>
        <input type="text" placeholder="Buscar productos" class="busqueda">
        <button class="boton-buscar">Buscar</button>
        <div class="acciones">
            <a href="#">Iniciar sesión</a>
            <a href="#">Carrito 🛒</a>
        </div>
    </header>

    <!-- Main - Productos -->
     <main>
        <h2>Ofertas destacadas</h2>
        <div class="productos">

            <div class="producto">
                <img src="/img/earphones.png" alt="Producto 1">
                <h3>Audífonos Bluetooth</h3>
                <p>$29.99</p>
                <button>Añadir al carrito</button>
            </div>

            <div class="producto">
                <img src="/img/teclado.png" alt="Producto 2">
                <h3>Teclado mecánico</h3>
                <p>$49.99</p>
                <button>Añadir al carrito</button>
            </div>

            <div class="producto">
                <img src="/img/mouse.png" alt="Producto 3">
                <h3>Mouse gamer</h3>
                <p>$19.99</p>
                <button>Añadir al carrito</button>
            </div>
        </div>
     </main>

     <!-- Footer -->
        <footer>
            <p>&copy; 2025 Amazon.com, Inc. o sus afiliados</p>
            <p>Condiciones de uso | Aviso de privacidad | Cookies</p>
            <p>Desarrollado por [Juanes]</p>
</body>
</html>
